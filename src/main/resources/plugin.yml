name: VRanks
version: '1.0.0'
main: com.example.vranks.VRanks
api-version: '1.20'
author: YourName
description: Assign and store player ranks with a configurable profanity filter.

commands:
  vranks:
    description: Manage player ranks.
    usage: /<command> add <username> <rank_name>
    aliases: [vrank]
    permission: vranks.admin
    permission-message: "You do not have permission to use this command."

permissions:
  vranks.admin:
    description: Allows use of /vranks and /vrank.
    default: op
